<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mithai Palace Logo Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=Noto+Serif+Devanagari:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream:#FDF8EC; --ivory:#F6EDD8; --maroon:#6E0C16; --maroon-light:#8E1A24;
    --gold:#B08A4C; --gold-deep:#7A5C24; --ink:#2A1A14; --ink-soft:#5C4A40;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--cream); color:var(--ink); font:400 1rem/1.6 Inter, system-ui, sans-serif; }
  header { max-width:1200px; margin:0 auto; padding:3rem 16px 1rem; }
  .eyebrow { font:500 .78rem Cinzel, serif; letter-spacing:.25em; color:var(--gold-deep); text-transform:uppercase; }
  h1 { font:700 clamp(2rem,5vw,3rem) Cinzel, serif; color:var(--maroon); margin:.3rem 0 .5rem; }
  header p { max-width:65ch; color:var(--ink-soft); }
  main { max-width:1200px; margin:0 auto; padding:1rem 16px 4rem; display:grid; gap:2rem; }
  .card { background:var(--ivory); border:1px solid var(--gold); border-radius:6px; overflow:hidden; }
  .card-head { padding:1.25rem 1.5rem .5rem; display:flex; gap:1rem; align-items:baseline; flex-wrap:wrap; }
  .num { font:600 .8rem Cinzel, serif; letter-spacing:.2em; color:var(--gold-deep); }
  h2 { font:600 1.6rem 'Cormorant Garamond', serif; color:var(--maroon); margin:0; }
  .desc { padding:0 1.5rem 1rem; color:var(--ink-soft); max-width:75ch; margin:0; }
  .desc b { color:var(--ink); font-weight:600; }
  .previews { display:grid; grid-template-columns: 1.3fr 1fr .55fr; border-top:1px solid rgb(176 138 76 / .5); }
  .pv { padding:1.5rem; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.75rem; min-height:260px; }
  .pv svg { width:100%; height:auto; max-height:320px; }
  .pv.light { background:var(--cream); }
  .pv.dark { background:var(--maroon); }
  .pv.small { background:var(--cream); border-left:1px solid rgb(176 138 76 / .5); gap:1rem; }
  .pv.small .row { display:flex; gap:14px; align-items:center; }
  .pv.small svg { width:auto; }
  .lbl { font:500 .7rem Inter, sans-serif; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); }
  .pv.dark .lbl { color:#E9D9B8; }
  @media (max-width: 760px) {
    .previews { grid-template-columns:1fr; }
    .pv.small { border-left:0; border-top:1px solid rgb(176 138 76 / .5); min-height:0; }
  }
</style>
</head>
<body>
<header>
  <div class="eyebrow">Brand exploration</div>
  <h1>Mithai Palace logo options</h1>
  <p>Six vector options built from the current logo's colours, arch, domes and four-petal flower. Each is shown on cream, reversed on maroon, and at icon size (favicon, social avatar). Pick one, or mix parts, and I'll export clean SVG/PNG files.</p>
</header>
<main id="board"></main>

<script>
const LIGHT = { w:'#6E0C16', g:'#B08A4C', gt:'#7A5C24', fill:'#FDF8EC', acc:'#6E0C16', soft:'#D9BD84' };
const DARK  = { w:'#FDF8EC', g:'#C9A566', gt:'#E4CFA0', fill:'#6E0C16', acc:'#FDF8EC', soft:'#8E1A24' };

const NS = 'vector-effect="non-scaling-stroke"';
const ARCH = 'M10,222 V120 C10,98 28,90 44,90 C44,70 60,58 76,56 C80,38 92,28 100,8 C108,28 120,38 124,56 C140,58 156,70 156,90 C172,90 190,98 190,120 V222';
const PETAL = 'M50 47 C40 38 37 22 50 6 C63 22 60 38 50 47 Z';

function dome(x, baseY, w, c, sw = 1.4) {
  const s = w / 40;
  return `<g transform="translate(${x},${baseY - 44 * s}) scale(${s})">
    <line x1="20" y1="6" x2="20" y2="-6" stroke="${c.g}" stroke-width="${sw}" ${NS}/>
    <circle cx="20" cy="-8" r="2.6" fill="${c.g}"/>
    <path d="M2,44 C-4,28 12,16 20,6 C28,16 44,28 38,44 Z" fill="${c.g}" fill-opacity=".85" stroke="${c.g}" stroke-width="${sw}" ${NS}/>
    <path d="M20,8 C16,20 14,32 15,44 M20,8 C24,20 26,32 25,44" fill="none" stroke="${c.fill}" stroke-opacity=".55" stroke-width="1" ${NS}/>
  </g>`;
}
function gate(cx, baseY, w, h, fill, stroke) {
  const x0 = cx - w / 2, x1 = cx + w / 2, sh = baseY - h * .62;
  return `<path d="M${x0},${baseY} V${sh} C${x0},${sh - h * .2} ${cx - w * .2},${sh - h * .25} ${cx},${baseY - h} C${cx + w * .2},${sh - h * .25} ${x1},${sh - h * .2} ${x1},${sh} V${baseY} Z" fill="${fill}" ${stroke ? `stroke="${stroke}" stroke-width="1.2"` : ''}/>`;
}
function petals(cx, cy, size, fill, stroke, sw = 3) {
  const s = size / 100;
  let p = '';
  for (const r of [0, 90, 180, 270]) p += `<path d="${PETAL}" transform="rotate(${r} 50 50)"/>`;
  return `<g transform="translate(${cx - size / 2},${cy - size / 2}) scale(${s})" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round">${p}<circle cx="50" cy="50" r="7" fill="${stroke}" stroke="none"/></g>`;
}
function palace(c) {
  const t = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c.fill}" stroke="${c.g}" stroke-width="1.4"/>`;
  return `
    ${t(34,125,6,25)}${t(160,125,6,25)}${t(62,112,8,38)}${t(130,112,8,38)}
    ${t(20,118,16,32)}${t(164,118,16,32)}
    ${t(40,100,24,50)}${t(136,100,24,50)}
    ${t(70,85,60,65)}
    <rect x="66" y="82" width="68" height="5" fill="${c.g}"/>
    <rect x="37" y="97" width="30" height="4" fill="${c.g}"/><rect x="133" y="97" width="30" height="4" fill="${c.g}"/>
    ${dome(75, 83, 50, c)}${dome(40, 98, 24, c)}${dome(136, 98, 24, c)}${dome(20, 118, 16, c)}${dome(164, 118, 16, c)}
    ${gate(100, 150, 22, 44, c.acc)}
    ${gate(80, 118, 7, 16, 'none', c.g)}${gate(120, 118, 7, 16, 'none', c.g)}
    ${gate(52, 150, 12, 26, 'none', c.g)}${gate(148, 150, 12, 26, 'none', c.g)}
    ${gate(52, 120, 7, 12, 'none', c.g)}${gate(148, 120, 7, 12, 'none', c.g)}
    ${gate(28, 150, 8, 18, 'none', c.g)}${gate(172, 150, 8, 18, 'none', c.g)}
    <line x1="12" y1="150.5" x2="188" y2="150.5" stroke="${c.g}" stroke-width="2.4"/>`;
}

/* 1. Heritage crest — faithful, simplified redraw of the current logo */
function crest(c) {
  return `<svg viewBox="0 0 200 330" xmlns="http://www.w3.org/2000/svg">
    <path d="${ARCH}" fill="none" stroke="${c.g}" stroke-width="3.2"/>
    <path d="${ARCH}" fill="none" stroke="${c.w}" stroke-width="1" transform="translate(100,222) scale(.95) translate(-100,-222)"/>
    <g transform="translate(100,222) scale(1.1) translate(-100,-150)">${palace(c)}</g>
    <text x="100" y="272" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="46" fill="${c.w}" textLength="186" lengthAdjust="spacingAndGlyphs">MITHAI</text>
    <text x="100" y="298" text-anchor="middle" font-family="Cinzel" font-weight="600" font-size="19" fill="${c.gt}" letter-spacing="8">PALACE</text>
    <path d="M22,291 l4,-4 l4,4 l-4,4 Z M170,291 l4,-4 l4,4 l-4,4 Z" fill="${c.g}"/>
    <text x="100" y="318" text-anchor="middle" font-family="Cinzel" font-weight="500" font-size="8.6" fill="${c.w}" letter-spacing="3">TRADITIONALLY SWEET</text>
  </svg>`;
}
function crestIcon(c, size) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg">
    <path d="${ARCH} Z" fill="${c.fill}" stroke="${c.g}" stroke-width="6"/>
    <g transform="translate(100,222) scale(1.1) translate(-100,-150)">${palace(c)}</g></svg>`;
}

/* 2. Arch monogram */
function monoMark(c, sw = 3.2) {
  return `<path d="${ARCH} Z" fill="${c.fill}" stroke="${c.g}" stroke-width="${sw}"/>
    <path d="${ARCH} Z" fill="none" stroke="${c.w}" stroke-width="1.2" transform="translate(100,222) scale(.9) translate(-100,-222)"/>
    ${petals(100, 80, 34, c.w, c.g, 5)}
    <text x="100" y="186" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="74" fill="${c.w}" textLength="128" lengthAdjust="spacingAndGlyphs">MP</text>
    <line x1="48" y1="202" x2="152" y2="202" stroke="${c.g}" stroke-width="1.5"/>`;
}
function mono(c) {
  return `<svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">${monoMark(c)}
    <text x="100" y="262" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="25" fill="${c.w}" letter-spacing="2">MITHAI PALACE</text>
    <text x="100" y="286" text-anchor="middle" font-family="Cormorant Garamond" font-style="italic" font-weight="500" font-size="17" fill="${c.gt}">Traditionally sweet</text></svg>`;
}
function monoIcon(c, size) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg">${monoMark(c, 7)}</svg>`;
}

/* 3. Horizontal gateway — header / signage lockup */
function gwMark(c, sw = 3) {
  return `<path d="${ARCH} Z" fill="${c.fill}" stroke="${c.g}" stroke-width="${sw}"/>
    ${dome(55, 120, 90, c, 2)}
    <rect x="50" y="118" width="100" height="104" fill="${c.fill}" stroke="${c.g}" stroke-width="2"/>
    ${gate(100, 222, 46, 82, c.acc)}
    <line x1="10" y1="221" x2="190" y2="221" stroke="${c.g}" stroke-width="4"/>`;
}
function gateway(c) {
  return `<svg viewBox="0 0 560 150" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(8,8) scale(.6)">${gwMark(c)}</g>
    <line x1="145" y1="22" x2="145" y2="128" stroke="${c.g}" stroke-width="1.2"/>
    <text x="168" y="86" font-family="Cinzel" font-weight="700" font-size="46" fill="${c.w}" textLength="380" lengthAdjust="spacingAndGlyphs">MITHAI PALACE</text>
    <text x="170" y="116" font-family="Cinzel" font-weight="500" font-size="13" fill="${c.gt}" letter-spacing="6.5">TRADITIONALLY SWEET</text></svg>`;
}
function gwIcon(c, size) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg">${gwMark(c, 7)}</svg>`;
}

/* 4. Royal seal — bilingual, for boxes, stickers, ribbons */
function sealSvg(c, withText = true) {
  const id = 'r' + Math.random().toString(36).slice(2, 7);
  return `<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
    <defs><path id="${id}t" d="M34,120 A86,86 0 0,1 206,120"/><path id="${id}b" d="M20,120 A100,100 0 0,0 220,120"/></defs>
    <circle cx="120" cy="120" r="116" fill="${c.fill}" stroke="${c.g}" stroke-width="3"/>
    <circle cx="120" cy="120" r="109" fill="none" stroke="${c.g}" stroke-width="1"/>
    <circle cx="120" cy="120" r="78" fill="none" stroke="${c.g}" stroke-width="1"/>
    ${withText ? `<text font-family="Cinzel" font-weight="700" font-size="21" fill="${c.w}" letter-spacing="4"><textPath href="#${id}t" startOffset="50%" text-anchor="middle">MITHAI PALACE</textPath></text>
    <text font-family="Cinzel" font-weight="600" font-size="11" fill="${c.gt}" letter-spacing="3.5"><textPath href="#${id}b" startOffset="50%" text-anchor="middle">TRADITIONALLY SWEET</textPath></text>
    <path d="M24,126 l4,-4 l4,4 l-4,4 Z M208,126 l4,-4 l4,4 l-4,4 Z" fill="${c.g}"/>` : ''}
    ${petals(120, 82, 36, c.w, c.g, 5)}
    <text x="120" y="138" text-anchor="middle" font-family="'Noto Serif Devanagari'" font-weight="700" font-size="30" fill="${c.w}">मिठाई</text>
    <text x="120" y="170" text-anchor="middle" font-family="'Noto Serif Devanagari'" font-weight="600" font-size="20" fill="${c.gt}">पैलेस</text></svg>`;
}
function sealIcon(c, size) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
    <circle cx="120" cy="120" r="112" fill="${c.fill}" stroke="${c.g}" stroke-width="10"/>
    ${petals(120, 120, 150, c.w, c.g, 5)}</svg>`;
}

/* 5. Ladoo dome — the palace dome is a boondi ladoo */
function ladooMark(c, detail = true) {
  let dots = '';
  if (detail) {
    for (let y = 44; y <= 116; y += 7) for (let x = 56; x <= 144; x += 7) {
      const ox = x + ((y / 7) % 2 ? 3.5 : 0);
      if ((ox - 100) ** 2 + (y - 80) ** 2 < 39 ** 2) dots += `<circle cx="${ox}" cy="${y}" r="2.6" fill="${c.gt}" fill-opacity=".45"/>`;
    }
  }
  return `
    <line x1="100" y1="38" x2="100" y2="16" stroke="${c.g}" stroke-width="3"/>
    <circle cx="100" cy="12" r="5" fill="${c.g}"/>
    <circle cx="100" cy="80" r="44" fill="${c.g}"/>${dots}
    <path d="M74,58 C80,48 92,43 100,42" fill="none" stroke="${c.fill}" stroke-opacity=".8" stroke-width="4" stroke-linecap="round"/>
    <rect x="46" y="118" width="108" height="10" rx="2" fill="${c.w}"/>
    <rect x="56" y="128" width="88" height="62" fill="${c.fill}" stroke="${c.g}" stroke-width="2.5"/>
    ${gate(76, 190, 16, 36, c.w)}${gate(100, 190, 20, 46, c.w)}${gate(124, 190, 16, 36, c.w)}
    <rect x="44" y="190" width="112" height="7" fill="${c.g}"/>
    <rect x="36" y="197" width="128" height="6" fill="${c.g}" fill-opacity=".7"/>`;
}
function ladoo(c) {
  return `<svg viewBox="0 0 200 290" xmlns="http://www.w3.org/2000/svg">${ladooMark(c)}
    <text x="100" y="246" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="40" fill="${c.w}" textLength="178" lengthAdjust="spacingAndGlyphs">MITHAI</text>
    <text x="100" y="274" text-anchor="middle" font-family="Cinzel" font-weight="600" font-size="17" fill="${c.gt}" letter-spacing="9">PALACE</text></svg>`;
}
function ladooIcon(c, size) {
  return `<svg width="${size}" height="${size}" viewBox="20 0 160 210" xmlns="http://www.w3.org/2000/svg">${ladooMark(c, size > 40)}</svg>`;
}

/* 6. Petal wordmark — type-only, for tape, receipts, narrow spaces */
function wordmark(c) {
  return `<svg viewBox="0 0 560 150" xmlns="http://www.w3.org/2000/svg">
    <text x="20" y="84" font-family="Cinzel" font-weight="700" font-size="54" fill="${c.w}" textLength="226" lengthAdjust="spacingAndGlyphs">MITHAI</text>
    ${petals(280, 66, 40, c.w, c.g, 5)}
    <text x="314" y="84" font-family="Cinzel" font-weight="600" font-size="54" fill="${c.gt}" textLength="226" lengthAdjust="spacingAndGlyphs">PALACE</text>
    <line x1="20" y1="108" x2="190" y2="108" stroke="${c.g}" stroke-width="1.2"/>
    <line x1="370" y1="108" x2="540" y2="108" stroke="${c.g}" stroke-width="1.2"/>
    <text x="280" y="114" text-anchor="middle" font-family="Cormorant Garamond" font-style="italic" font-weight="500" font-size="24" fill="${c.w}">Traditionally sweet</text></svg>`;
}
function wordIcon(c, size) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" rx="18" fill="${c.fill}" stroke="${c.g}" stroke-width="3"/>
    ${petals(50, 50, 80, c.w, c.g, 4)}</svg>`;
}

const OPTIONS = [
  { name:'Heritage crest', full:crest, icon:crestIcon,
    desc:'<b>Closest to what you have now.</b> The same arch, palace, domes and stacked wordmark, redrawn as clean flat vector art so it prints sharply in one or two colours. <b>Best for:</b> shop sign, box lids and the website hero. <b>Weakness:</b> too detailed at small sizes (see the 32px version).' },
  { name:'Arch monogram', full:mono, icon:monoIcon,
    desc:'<b>An "MP" monogram inside the Mughal arch</b>, topped by the four-petal flower. Formal, jewellery-box feel, and stays readable when small. <b>Best for:</b> favicon, Instagram avatar, gold-foil stickers, embossed boxes.' },
  { name:'Horizontal gateway', full:gateway, icon:gwIcon,
    desc:'<b>A wide layout</b>: a small arch with a single dome and a maroon doorway, next to the name on one line. <b>Best for:</b> the website header, the fascia above the shopfront, email signatures and letterheads. Pairs naturally with option 1 as its short version.' },
  { name:'Royal seal', full:c => sealSvg(c), icon:sealIcon,
    desc:'<b>A round badge with the name in both English and Hindi</b>: the English runs around the edge, with <b>मिठाई पैलेस</b> in the middle. It reads as a stamp of authenticity. <b>Best for:</b> box seals, ribbon tags, festive packaging and social posts. Worth confirming the Hindi spelling with the owner.' },
  { name:'Ladoo dome', full:ladoo, icon:ladooIcon,
    desc:'<b>The playful option</b>: the palace dome is a boondi ladoo with a thin line of shine. It is the only concept that says <i>sweets</i> and not just <i>palace</i>, so it is the most memorable and easiest to recognise. <b>Best for:</b> younger customers, delivery apps and merchandise. Less formal than the others.' },
  { name:'Petal wordmark', full:wordmark, icon:wordIcon,
    desc:'<b>Text only</b>, with the four-petal flower between the words and the tagline in italic serif. The quietest and most flexible option. <b>Best for:</b> receipts, packing tape, menus and narrow spaces. Uses the petal (already your favicon) as the icon.' },
];

document.getElementById('board').innerHTML = OPTIONS.map((o, i) => `
  <section class="card">
    <div class="card-head"><span class="num">Option ${i + 1}</span><h2>${o.name}</h2></div>
    <p class="desc">${o.desc}</p>
    <div class="previews">
      <div class="pv light">${o.full(LIGHT)}<span class="lbl">On cream</span></div>
      <div class="pv dark">${o.full(DARK)}<span class="lbl">Reversed on maroon</span></div>
      <div class="pv small">
        <div class="row">${o.icon(LIGHT, 64)}${o.icon(LIGHT, 32)}${o.icon(LIGHT, 16)}</div>
        <div class="row" style="background:var(--maroon);padding:8px;border-radius:4px">${o.icon(DARK, 64)}${o.icon(DARK, 32)}</div>
        <span class="lbl">Icon · 64 / 32 / 16 px</span>
      </div>
    </div>
  </section>`).join('');
</script>
</body>
</html>
